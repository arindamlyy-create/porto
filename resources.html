  <style>
    :root {
      --olive: #716D4A;
      --beige: #F2E0D2;
      --matcha: #959B67;
      --rosewood: #88445A;
      --plum: #5F3342;
      --wine: #A23A52;
      --leaf: #7A9E4E;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #fff; color: var(--plum);
      font-family: Arial, Helvetica, sans-serif;
      padding: 34px 6.5% 60px; min-height: 100vh;
    }
    a { color: inherit; text-decoration: none; }

    nav {
      max-width: 1100px; margin: 0 auto;
      display: flex; justify-content: space-between;
      font-size: 12px; letter-spacing: 2.5px;
    }
    nav a { transition: opacity .2s ease; }
    nav a:hover { opacity: .6; }

        header { max-width: 1100px; margin: 60px auto 56px; text-align: center; }
    h1 {
      font-family: 'Fraunces', Georgia, serif; font-style: italic; font-weight: 400;
      font-size: clamp(44px, 8vw, 96px); color: var(--wine);
      letter-spacing: -.02em; line-height: 1;
    }
    header p {
      margin-top: 10px; padding-bottom: 6px;
      color: var(--leaf);
      font-family: 'Inter', Arial, sans-serif; font-style: normal; font-weight: 400;
      font-size: clamp(14px, 2vw, 18px); letter-spacing: 0;
    }

    /* DAFTAR MATERI — bar panjang tipis */
    .list {
      max-width: 760px; margin: 0 auto;
      display: flex; flex-direction: column; gap: 10px;
    }
    .item {
      display: flex; align-items: center; gap: 16px;
      background: var(--beige);
      border-left: 5px solid var(--olive);
      border-radius: 6px;
      padding: 14px 20px;
      transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
    }
    .item:hover {
      transform: translateX(4px);
      box-shadow: 0 6px 16px rgba(95, 51, 66, .15);
      background: #f6e8dc;
    }
    .tag {
      flex-shrink: 0;
      font-family: 'Courier Prime', monospace; font-weight: 700;
      font-size: 10px; letter-spacing: 2px; color: #fff;
      background: var(--olive); padding: 4px 10px; border-radius: 99px;
    }
    .item h3 {
      flex: 1;
      font-family: 'Fraunces', Georgia, serif; font-style: italic; font-weight: 400;
      font-size: clamp(16px, 2.4vw, 21px); line-height: 1.2;
      color: var(--rosewood);
    }
    .arrow {
      flex-shrink: 0; font-size: 18px; color: var(--rosewood);
      transition: transform .2s ease;
    }
    .item:hover .arrow { transform: translateX(4px); }

    footer {
      max-width: 1100px; margin: 60px auto 0; text-align: center;
      color: var(--rosewood); font-size: 12px;
    }

    @media (max-width: 520px) {
      .item { padding: 12px 14px; gap: 10px; }
      .tag { font-size: 9px; padding: 3px 8px; }
    }
  </style>
</head>
